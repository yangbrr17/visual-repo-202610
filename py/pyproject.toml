[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reportkit"
version = "0.1.0"
description = "Build offline, data-separated, interactive client reports (pitchbook quality) from Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # stdlib only; pandas / numpy are optional inputs
keywords = ["report", "dashboard", "pitchbook", "echarts", "offline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5", "numpy>=1.22"]
parquet = ["pandas>=1.5", "numpy>=1.22", "pyarrow>=12"]
excel = ["pandas>=1.5", "openpyxl>=3.1"]

[project.scripts]
reportkit = "reportkit.cli:main"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["reportkit"]
